name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # A3 completion (brief §13): the full 10,000-game AI-vs-AI soak. The
  # fast gate above runs the same test file with its default count
  # (120 games); this job runs the brief's full count, split across an
  # 8-shard matrix (8 × 1,250 games, disjoint seed ranges).
  soak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Actions expressions have no arithmetic operators, so each
        # shard's seed offset is spelled out (shard × 1,250 games).
        include:
          - { shard: 0, offset: 0 }
          - { shard: 1, offset: 1250 }
          - { shard: 2, offset: 2500 }
          - { shard: 3, offset: 3750 }
          - { shard: 4, offset: 5000 }
          - { shard: 5, offset: 6250 }
          - { shard: 6, offset: 7500 }
          - { shard: 7, offset: 8750 }
    env:
      AI_SOAK_GAMES: "1250"
      AI_SOAK_SEED_OFFSET: "${{ matrix.offset }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/ai/test/soak.test.ts -t "A3 soak"
