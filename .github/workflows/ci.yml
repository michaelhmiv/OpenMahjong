name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:packages
      - run: npm run check:security
      # Same suite as `npm test`, with worker parallelism capped: the
      # suite contains several minute-long game-simulation files, and
      # with a worker per core the vitest progress RPC starves past its
      # 60 s timeout — failing the job with an "onTaskUpdate" error
      # even when every test passes (observed repeatedly; see
      # packages/ai/test/soak.test.ts). Two workers keep the main
      # process responsive and each worker fed.
      - run: npx vitest run --maxWorkers=2

  # A3 completion (brief §13): the full 10,000-game AI-vs-AI soak. The
  # fast gate above runs the same test file with its default count
  # (120 games); this job runs the brief's full count, split across an
  # 8-shard matrix (8 × 1,250 games, disjoint seed ranges).
  soak:
    # Keep the representative 120-game soak in every PR's normal
    # suite. The disjoint 10,000-game sweep runs weekly or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Actions expressions have no arithmetic operators, so each
        # shard's seed offset is spelled out (shard × 1,250 games).
        include:
          - { shard: 0, offset: 0 }
          - { shard: 1, offset: 1250 }
          - { shard: 2, offset: 2500 }
          - { shard: 3, offset: 3750 }
          - { shard: 4, offset: 5000 }
          - { shard: 5, offset: 6250 }
          - { shard: 6, offset: 7500 }
          - { shard: 7, offset: 8750 }
    env:
      AI_SOAK_GAMES: "1250"
      AI_SOAK_SEED_OFFSET: "${{ matrix.offset }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/ai/test/soak.test.ts -t "A3 soak"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@openmahjong/web
      - run: npx playwright-core install --with-deps chromium
      - name: Guest, lessons, accessibility, replay, and offline smoke
        run: |
          PORT=4173 node packages/web/server.mjs > /tmp/openmahjong-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          npm run test:browser -- http://127.0.0.1:4173 work/browser-smoke
        env:
          BROWSER_FULL_GAME: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            work/browser-smoke/
            /tmp/openmahjong-web.log
