name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:packages
      # Security gate policy (owner ruling, 2026-11-17): the BLOCKING
      # audit (check:security) covers production dependencies only
      # (npm audit --omit=dev). The full audit, dev dependencies
      # included, runs after the test suite as an advisory,
      # non-blocking report (check:security:dev). Rationale: picomatch
      # GHSA-fc5q-39xc-vjpf (ReDoS) has no patched release and reaches
      # this repo only through the dev toolchain (picomatch <-
      # fdir/tinyglobby <- vite/vitest); it must not block merges or
      # skip the test suite, and it stays visible in the advisory
      # report until upstream ships a fix.
      - run: npm run check:security
      # i18n gates (brief-i18n-v1 Phase 1): the English key file must be
      # exactly what the extractor produces from current sources, and
      # every shipped locale must be 100% approved on new/changed
      # strings. Both run after the build so a stale key file or a
      # failing gate blocks the PR like any other test failure.
      - run: node scripts/extract-i18n.mjs --check
      - run: node scripts/i18n-coverage.mjs --gate
      # Wiring gate (brief-i18n-v1 rewire): no user-facing literal in a
      # render file may be rendered without t()/tx(). The extractor
      # alone cannot catch that — it mints the key and --check passes
      # once en.json is regenerated, while the screen still shows
      # English. This check fails until the literal is wired (or the
      # record carries the key and resolves it at the site). Proven to
      # fail on pre-rewire main (1,437 unwired literals); passes on the
      # rewired tree.
      - run: node scripts/check-i18n-wiring.mjs
      # Same suite as `npm test`, with worker parallelism capped: the
      # suite contains several minute-long game-simulation files, and
      # with a worker per core the vitest progress RPC starves past its
      # 60 s timeout — failing the job with an "onTaskUpdate" error
      # even when every test passes (observed repeatedly; see
      # packages/ai/test/soak.test.ts). Two workers keep the main
      # process responsive and each worker fed.
      - run: npx vitest run --maxWorkers=2
      # Advisory only: the full audit, dev dependencies included.
      # Never fails the job; it keeps dev-only advisories (e.g.
      # picomatch GHSA-fc5q-39xc-vjpf) visible in CI output until
      # they are patched upstream. See the gate policy note above.
      - name: Full dependency audit (advisory, non-blocking)
        if: always()
        continue-on-error: true
        run: npm run check:security:dev

  # i18n community review: no self-approval (community-review-design.md
  # §3). A correction PR must not mark its own wording reviewed/approved,
  # and a status flip must come from someone other than the wording's
  # author. Runs on pull requests (base/head SHAs) and on pushes to main
  # (before/after SHAs); skipped for a push that creates the branch
  # (before is all zeros — no base to diff against). Full history is
  # fetched so the R3 blame check can run; without it R3 degrades to a
  # warning and R1/R2 still enforce.
  i18n-approval-gate:
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No-self-approval gate for translation PRs
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/i18n-approval-gate.mjs --base "$GATE_BASE" --head "$GATE_HEAD"

  # A3 completion (brief §13): the full 10,000-game AI-vs-AI soak. The
  # fast gate above runs the same test file with its default count
  # (120 games); this job runs the brief's full count, split across an
  # 8-shard matrix (8 × 1,250 games, disjoint seed ranges).
  soak:
    # Keep the representative 120-game soak in every PR's normal
    # suite. The disjoint 10,000-game sweep runs weekly or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Actions expressions have no arithmetic operators, so each
        # shard's seed offset is spelled out (shard × 1,250 games).
        include:
          - { shard: 0, offset: 0 }
          - { shard: 1, offset: 1250 }
          - { shard: 2, offset: 2500 }
          - { shard: 3, offset: 3750 }
          - { shard: 4, offset: 5000 }
          - { shard: 5, offset: 6250 }
          - { shard: 6, offset: 7500 }
          - { shard: 7, offset: 8750 }
    env:
      AI_SOAK_GAMES: "1250"
      AI_SOAK_SEED_OFFSET: "${{ matrix.offset }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/ai/test/soak.test.ts -t "A3 soak"

  # Per-variant completion soak: 10,000 games per variant, sharded by
  # measured cost (see packages/ai/test/variant-soak.test.ts header).
  # hong-kong and taiwanese mirror the riichi shard shape (8 × 1,250);
  # mcr games cost ~7× a riichi game (vendored scorer on every win
  # check), so mcr runs 50 × 200 for a comparable shard envelope.
  variant-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: hong-kong, shard: 0, games: 1250, offset: 0 }
          - { variant: hong-kong, shard: 1, games: 1250, offset: 1250 }
          - { variant: hong-kong, shard: 2, games: 1250, offset: 2500 }
          - { variant: hong-kong, shard: 3, games: 1250, offset: 3750 }
          - { variant: hong-kong, shard: 4, games: 1250, offset: 5000 }
          - { variant: hong-kong, shard: 5, games: 1250, offset: 6250 }
          - { variant: hong-kong, shard: 6, games: 1250, offset: 7500 }
          - { variant: hong-kong, shard: 7, games: 1250, offset: 8750 }
          - { variant: taiwanese, shard: 0, games: 1250, offset: 0 }
          - { variant: taiwanese, shard: 1, games: 1250, offset: 1250 }
          - { variant: taiwanese, shard: 2, games: 1250, offset: 2500 }
          - { variant: taiwanese, shard: 3, games: 1250, offset: 3750 }
          - { variant: taiwanese, shard: 4, games: 1250, offset: 5000 }
          - { variant: taiwanese, shard: 5, games: 1250, offset: 6250 }
          - { variant: taiwanese, shard: 6, games: 1250, offset: 7500 }
          - { variant: taiwanese, shard: 7, games: 1250, offset: 8750 }
          - { variant: mcr, shard: 0, games: 200, offset: 0 }
          - { variant: mcr, shard: 1, games: 200, offset: 200 }
          - { variant: mcr, shard: 2, games: 200, offset: 400 }
          - { variant: mcr, shard: 3, games: 200, offset: 600 }
          - { variant: mcr, shard: 4, games: 200, offset: 800 }
          - { variant: mcr, shard: 5, games: 200, offset: 1000 }
          - { variant: mcr, shard: 6, games: 200, offset: 1200 }
          - { variant: mcr, shard: 7, games: 200, offset: 1400 }
          - { variant: mcr, shard: 8, games: 200, offset: 1600 }
          - { variant: mcr, shard: 9, games: 200, offset: 1800 }
          - { variant: mcr, shard: 10, games: 200, offset: 2000 }
          - { variant: mcr, shard: 11, games: 200, offset: 2200 }
          - { variant: mcr, shard: 12, games: 200, offset: 2400 }
          - { variant: mcr, shard: 13, games: 200, offset: 2600 }
          - { variant: mcr, shard: 14, games: 200, offset: 2800 }
          - { variant: mcr, shard: 15, games: 200, offset: 3000 }
          - { variant: mcr, shard: 16, games: 200, offset: 3200 }
          - { variant: mcr, shard: 17, games: 200, offset: 3400 }
          - { variant: mcr, shard: 18, games: 200, offset: 3600 }
          - { variant: mcr, shard: 19, games: 200, offset: 3800 }
          - { variant: mcr, shard: 20, games: 200, offset: 4000 }
          - { variant: mcr, shard: 21, games: 200, offset: 4200 }
          - { variant: mcr, shard: 22, games: 200, offset: 4400 }
          - { variant: mcr, shard: 23, games: 200, offset: 4600 }
          - { variant: mcr, shard: 24, games: 200, offset: 4800 }
          - { variant: mcr, shard: 25, games: 200, offset: 5000 }
          - { variant: mcr, shard: 26, games: 200, offset: 5200 }
          - { variant: mcr, shard: 27, games: 200, offset: 5400 }
          - { variant: mcr, shard: 28, games: 200, offset: 5600 }
          - { variant: mcr, shard: 29, games: 200, offset: 5800 }
          - { variant: mcr, shard: 30, games: 200, offset: 6000 }
          - { variant: mcr, shard: 31, games: 200, offset: 6200 }
          - { variant: mcr, shard: 32, games: 200, offset: 6400 }
          - { variant: mcr, shard: 33, games: 200, offset: 6600 }
          - { variant: mcr, shard: 34, games: 200, offset: 6800 }
          - { variant: mcr, shard: 35, games: 200, offset: 7000 }
          - { variant: mcr, shard: 36, games: 200, offset: 7200 }
          - { variant: mcr, shard: 37, games: 200, offset: 7400 }
          - { variant: mcr, shard: 38, games: 200, offset: 7600 }
          - { variant: mcr, shard: 39, games: 200, offset: 7800 }
          - { variant: mcr, shard: 40, games: 200, offset: 8000 }
          - { variant: mcr, shard: 41, games: 200, offset: 8200 }
          - { variant: mcr, shard: 42, games: 200, offset: 8400 }
          - { variant: mcr, shard: 43, games: 200, offset: 8600 }
          - { variant: mcr, shard: 44, games: 200, offset: 8800 }
          - { variant: mcr, shard: 45, games: 200, offset: 9000 }
          - { variant: mcr, shard: 46, games: 200, offset: 9200 }
          - { variant: mcr, shard: 47, games: 200, offset: 9400 }
          - { variant: mcr, shard: 48, games: 200, offset: 9600 }
          - { variant: mcr, shard: 49, games: 200, offset: 9800 }
    env:
      AI_VARIANT_SOAK_VARIANT: "${{ matrix.variant }}"
      AI_VARIANT_SOAK_GAMES: "${{ matrix.games }}"
      AI_VARIANT_SOAK_SEED_OFFSET: "${{ matrix.offset }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/ai/test/variant-soak.test.ts -t "variant soak"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Guest, lessons, accessibility, replay, and offline smoke
        run: |
          PORT=4173 node packages/web/server.mjs > /tmp/openmahjong-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          npm run test:browser -- http://127.0.0.1:4173 work/browser-smoke
          node scripts/browser-lesson-layout.mjs http://127.0.0.1:4173 work/program-evidence/lesson-layout
          node scripts/browser-in-person.mjs http://127.0.0.1:4173 work/program-evidence/riichi-tools
          for variant in hong-kong mcr taiwanese; do
            node scripts/browser-variants.mjs http://127.0.0.1:4173 work/program-evidence/variants "$variant"
          done
          node scripts/browser-variant-calculators.mjs http://127.0.0.1:4173 work/program-evidence/calculators
          node scripts/browser-variant-sizing.mjs http://127.0.0.1:4173 work/program-evidence/sizing
          node scripts/browser-review-timeline.mjs http://127.0.0.1:4173 work/program-evidence/review
          node scripts/browser-table-sync.mjs http://127.0.0.1:4173 work/program-evidence/sync
          node scripts/index-program-evidence.mjs work/program-evidence
        env:
          BROWSER_FULL_GAME: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            work/browser-smoke/
            work/program-evidence/
            /tmp/openmahjong-web.log

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openmahjong_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openmahjong_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/server/test/postgres-integration.test.ts packages/server/test/online-postgres.test.ts
        env:
          OPENMAHJONG_TEST_DB: postgresql://postgres@127.0.0.1:5432/openmahjong_test
      - run: npm run build
        env:
          VITE_ONLINE_API_ORIGIN: http://localhost:4188
      - run: npx playwright-core install --with-deps chromium
      - name: Four independent seats through online results and rematch
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/openmahjong_test
          APP_ORIGIN: http://localhost:4187
          ONLINE_RANKED: "on"
        run: |
          PORT=4188 node packages/server/dist/index.js > /tmp/multiplayer-api.log 2>&1 &
          PORT=4187 node packages/web/server.mjs > /tmp/multiplayer-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4188/healthz && curl -fsS -o /dev/null http://localhost:4187/; then break; fi
            sleep 1
          done
          node scripts/browser-multiplayer.mjs
