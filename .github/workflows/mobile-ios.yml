name: iOS

# Open Mahjong iOS CI (brief-ios-v1 step 2): cloned job-for-job from
# Munch's .github/workflows/mobile-ios.yml, adapted only for this
# repo's npm-workspaces shape (the iOS project lives in
# packages/web/ios, the bundle is staged by packages/web's
# mobile:web script, and the reproducibility gate covers
# packages/web/ios + packages/web/package.json + package-lock.json).
# Signing follows the shared-cert flow proven in PitTech's
# .github/workflows/ios-build.yml and Munch's distribute leg: the ONE
# shared CI distribution certificate is imported from the
# IOS_DIST_CERT_* secrets and only the per-app "Open Mahjong App
# Store CI" provisioning profile is created fresh via the App Store
# Connect API. No certificate is ever created, revoked, or swept
# here — mint-per-build is retired (Michael's ruling, 2026-11-20).
#
# Jobs:
#   validate   — PR/push/simulator leg: build the .mobile-web bundle,
#                `cap sync ios`, configure the shell, reproducibility
#                check, unsigned simulator build
#                (CODE_SIGNING_ALLOWED=NO). No secrets, no signing.
#   smoke      — XCUITest journey (packages/web/ios/App/AppUITests)
#                that boots the packaged app on a simulator and runs
#                the guest journey: Play renders → CPU game → table
#                renders → Learn → back to Play. The bundle is the
#                real local bundle — CPU play is fully local, so
#                there is no fixture swap and no credential. Per-step
#                screenshots + console/crash logs are artifacts.
#   asc-probe  — workflow_dispatch only: report-only ASC check (GET
#                apps + bundleIds for app.openmahjong) via
#                packages/web/scripts/asc-probe.py; creates nothing.
#   asc-setup  — workflow_dispatch only: creates the bundle ID record
#                (and attempts the app record) through the ASC API,
#                idempotently, via packages/web/scripts/asc-setup.py.
#   distribute — workflow_dispatch only, needs validate: shared-cert
#                signing flow — ES256 JWT (openssl + Python stdlib),
#                Sign in with Apple capability ensured idempotently,
#                fresh "Open Mahjong App Store CI" profile referencing
#                the shared cert, sign, export, and upload to App
#                Store Connect / TestFlight. No fastlane, no match,
#                no local-Mac step.

on:
  pull_request:
    paths:
      - "packages/web/ios/**"
      - "packages/web/capacitor.config.ts"
      - "packages/web/package.json"
      - "package-lock.json"
      - "packages/web/scripts/**"
      - ".github/workflows/mobile-ios.yml"
  push:
    branches:
      - main
    paths:
      - "packages/web/ios/**"
      - "packages/web/capacitor.config.ts"
      - "packages/web/package.json"
      - "package-lock.json"
      - "packages/web/scripts/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:
    inputs:
      build_mode:
        description: Simulator build, ASC probe (report-only), ASC setup, or signed build + upload to App Store Connect.
        required: true
        type: choice
        options:
          - simulator
          - asc-probe
          - asc-setup
          - app-store-ipa
        default: simulator

permissions:
  contents: read

concurrency:
  group: openmahjong-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Simulator build)
    if: github.event_name != 'workflow_dispatch' || inputs.build_mode == 'simulator' || inputs.build_mode == 'app-store-ipa'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
      - name: Install dependencies
        run: npm ci
      - name: Build local mobile web bundle
        run: npm run mobile:web --workspace=@openmahjong/web
      - name: Synchronize Capacitor iOS project
        working-directory: packages/web
        run: npx cap sync ios
      - name: Configure iOS native shell
        working-directory: packages/web
        run: node scripts/configure-mobile-ios.mjs
      - name: Verify native project is reproducible
        run: git diff --exit-code -- packages/web/ios packages/web/package.json package-lock.json
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project packages/web/ios/App/App.xcodeproj -scheme App
      - name: Build for iOS Simulator (unsigned)
        run: >-
          xcodebuild
          -project packages/web/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: openmahjong-ios-simulator
          path: build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke (Simulator boot + guest journey)
    if: github.event_name != 'workflow_dispatch' || inputs.build_mode == 'simulator' || inputs.build_mode == 'app-store-ipa'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
      - name: Install dependencies
        run: npm ci
      - name: Build local mobile web bundle
        run: npm run mobile:web --workspace=@openmahjong/web
      - name: Synchronize Capacitor iOS project
        working-directory: packages/web
        run: npx cap sync ios
      - name: Configure iOS native shell
        working-directory: packages/web
        run: node scripts/configure-mobile-ios.mjs
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project packages/web/ios/App/App.xcodeproj -scheme App
      - name: Select and boot an iPhone simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no iPhone simulator available")
          ')"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Guarantee the cold-start state the smoke asserts: no prior
          # install, no stored guest state.
          xcrun simctl uninstall "$udid" app.openmahjong || true
      - name: Capture the app console log
        run: |
          set -euo pipefail
          mkdir -p build/ios-smoke
          nohup xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact --predicate 'process == "App"' > build/ios-smoke/app-console.log 2>&1 &
          disown || true
      - name: Run the boot/flow smoke (XCUITest)
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project packages/web/ios/App/App.xcodeproj \
            -scheme App \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/ios-smoke-derived \
            -resultBundlePath build/ios-smoke/OpenMahjongSmoke.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios-smoke/xcodebuild-test.log
      - name: Export step screenshots from the result bundle
        if: always()
        run: |
          set -euo pipefail
          if [[ -d build/ios-smoke/OpenMahjongSmoke.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/ios-smoke/OpenMahjongSmoke.xcresult \
              --output-path build/ios-smoke/screenshots || true
          fi
      - name: Collect crash reports and stop log capture
        if: always()
        run: |
          set -euo pipefail
          pkill -f "log stream" || true
          crash_src="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data/Library/Logs/CrashReporter"
          if [[ -d "$crash_src" ]]; then
            mkdir -p build/ios-smoke/crash-reports
            cp -R "$crash_src/." build/ios-smoke/crash-reports/ || true
          fi
          find build/ios-smoke -maxdepth 2 | head -50 || true
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmahjong-ios-smoke-${{ github.run_number }}
          path: build/ios-smoke/
          if-no-files-found: warn
          retention-days: 14

  asc-probe:
    name: ASC probe (report-only)
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'asc-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for secret_name in \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Configure ${secret_name} in this repository's Actions secrets before running the ASC probe."
              exit 1
            fi
          done
      - name: Probe ASC for the Open Mahjong app record and bundle ID
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          trap 'rm -f "$key_path"' EXIT
          ASC_PRIVATE_KEY_PATH="$key_path" python3 packages/web/scripts/asc-probe.py

  asc-setup:
    name: ASC setup (create bundle ID, attempt app record)
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'asc-setup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for secret_name in \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Configure ${secret_name} in this repository's Actions secrets before running ASC setup."
              exit 1
            fi
          done
      - name: Create the Open Mahjong bundle ID and attempt the app record via the ASC API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          trap 'rm -f "$key_path"' EXIT
          ASC_PRIVATE_KEY_PATH="$key_path" python3 packages/web/scripts/asc-setup.py

  distribute:
    name: Build and upload to App Store Connect
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'app-store-ipa'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for secret_name in \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Configure ${secret_name} in this repository's Actions secrets before requesting an App Store build."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build local mobile web bundle
        run: npm run mobile:web --workspace=@openmahjong/web
      - name: Synchronize Capacitor iOS project
        working-directory: packages/web
        run: npx cap sync ios
      - name: Configure iOS native shell
        working-directory: packages/web
        run: node scripts/configure-mobile-ios.mjs

      - name: Generate signing material with the App Store Connect API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          IOS_DIST_CERT_ID: ${{ secrets.IOS_DIST_CERT_ID }}
        run: |
          set -euo pipefail
          sign_dir="$RUNNER_TEMP/openmahjong-signing"
          mkdir -p "$sign_dir"
          printf '%s' "$ASC_PRIVATE_KEY" > "$sign_dir/AuthKey.p8"
          SIGN_DIR="$sign_dir" python3 - <<'PYASC'
          import base64, json, os, pathlib, subprocess, time
          import urllib.request, urllib.error

          sign_dir = pathlib.Path(os.environ["SIGN_DIR"])
          key_id = os.environ["ASC_KEY_ID"]
          issuer_id = os.environ["ASC_ISSUER_ID"]

          # ES256 JWT signed with openssl + stdlib only (runner Python is
          # externally managed, so pip installs are not an option).
          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          now = int(time.time())
          header = b64url(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}, separators=(",", ":")).encode())
          payload = b64url(json.dumps({"iss": issuer_id, "iat": now, "exp": now + 1200,
                                       "aud": "appstoreconnect-v1"}, separators=(",", ":")).encode())
          (sign_dir / "jwt-input.bin").write_bytes(f"{header}.{payload}".encode())
          subprocess.run(["openssl", "dgst", "-sha256", "-sign", str(sign_dir / "AuthKey.p8"),
                          "-out", str(sign_dir / "jwt-sig.der"), str(sign_dir / "jwt-input.bin")], check=True)
          der = (sign_dir / "jwt-sig.der").read_bytes()
          idx = 2 + (der[1] & 0x7F) if der[1] & 0x80 else 2

          def read_int(buf, i):
              length = buf[i + 1]
              value = buf[i + 2:i + 2 + length].lstrip(b"\x00").rjust(32, b"\x00")
              return value, i + 2 + length

          r, idx = read_int(der, idx)
          s, idx = read_int(der, idx)
          token = f"{header}.{payload}.{b64url(r + s)}"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          api = "https://api.appstoreconnect.apple.com/v1"

          def call(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f"ASC API {method} {path} failed ({error.code}): "
                      f"{error.read().decode()[:600]}")

          # Shared CI distribution certificate (Michael's ruling,
          # 2026-11-20): ONE Apple Distribution certificate is shared by
          # all of Michael's apps' iOS CI because the team effectively
          # caps at 2 DISTRIBUTION certs and per-build minting collided
          # with that cap; mint-per-build is retired. The shared cert +
          # its private key live in this repo's IOS_DIST_CERT_* secrets
          # as a .p12 (IOS_DIST_CERT_P12_BASE64 /
          # IOS_DIST_CERT_P12_PASSWORD); IOS_DIST_CERT_ID is the shared
          # cert's App Store Connect certificate ID, referenced by the
          # provisioning profile created below. This step never creates
          # or revokes a certificate.
          shared_cert_id = os.environ.get("IOS_DIST_CERT_ID", "").strip()
          shared_p12_base64 = os.environ.get("IOS_DIST_CERT_P12_BASE64", "").strip()
          shared_p12_password = os.environ.get("IOS_DIST_CERT_P12_PASSWORD", "")
          if not shared_cert_id or not shared_p12_base64:
              raise SystemExit(
                  "Configure the IOS_DIST_CERT_ID and "
                  "IOS_DIST_CERT_P12_BASE64 secrets (shared CI distribution "
                  "certificate) before requesting an App Store build.")
          shared_p12_path = sign_dir / "shared-distribution.p12"
          shared_p12_path.write_bytes(base64.b64decode(shared_p12_base64))

          # Delete the previous CI provisioning profile, if present. The
          # profile is per-app and API-managed; the certificate it
          # referenced is the shared cert now and is never revoked here.
          old_profiles = call("GET", "/profiles?filter[name]=Open%20Mahjong%20App%20Store%20CI&limit=50").get("data", [])
          for old_profile in old_profiles:
              call("DELETE", f"/profiles/{old_profile['id']}")
              print(f"Deleted previous CI profile {old_profile['id']}")

          # Extract the shared certificate and private key into exactly
          # the artifact paths the rest of this step already consumes:
          # ci.cer (DER certificate) and ci.key (PEM private key).
          subprocess.run(["openssl", "pkcs12", "-in", str(shared_p12_path),
                          "-passin", f"pass:{shared_p12_password}",
                          "-clcerts", "-nokeys",
                          "-out", str(sign_dir / "shared-cert.pem")], check=True)
          subprocess.run(["openssl", "x509", "-in", str(sign_dir / "shared-cert.pem"),
                          "-outform", "DER", "-out", str(sign_dir / "ci.cer")], check=True)
          subprocess.run(["openssl", "pkcs12", "-in", str(shared_p12_path),
                          "-passin", f"pass:{shared_p12_password}",
                          "-nocerts", "-nodes",
                          "-out", str(sign_dir / "ci.key")], check=True)
          print(f"Using shared distribution certificate {shared_cert_id}")

          bundle_records = call("GET", "/bundleIds?filter[identifier]=app.openmahjong&limit=200").get("data", [])
          exact_matches = [record for record in bundle_records
                           if record.get("attributes", {}).get("identifier") == "app.openmahjong"]
          if len(exact_matches) != 1:
              returned = ", ".join(
                  f"{record.get('attributes', {}).get('identifier')} ({record.get('id')})"
                  for record in bundle_records) or "none"
              raise SystemExit(
                  "Expected exactly one bundle ID record with identifier app.openmahjong; "
                  f"the identifier filter returned {len(bundle_records)} record(s): {returned}")
          bundle_id = exact_matches[0]["id"]

          # The app declares the Sign in with Apple entitlement (step 3
          # of the iOS program adds it to the App target), so the bundle
          # ID must carry the matching capability or the profile minted
          # below lacks the entitlement and the archive rejects it.
          # Enable it idempotently BEFORE minting: enabling a capability
          # invalidates existing profiles, and the passes below delete
          # and re-create the CI profile anyway. The create call must
          # carry the capability's configuration: without a settings
          # entry the ASC API rejects it with 409 ENTITY_ERROR "Please
          # select at least one configuration for Sign In with Apple."
          # (Munch run 43412841511). Per Apple's CapabilitySetting /
          # CapabilityOption references, the setting key is
          # APPLE_ID_AUTH_APP_CONSENT, and enabling this bundle ID as
          # the primary App ID is its PRIMARY_APP_CONSENT option.
          # (This app declares no Associated Domains entitlement, so —
          # unlike Munch — there is no ASSOCIATED_DOMAINS ensure here.)
          capabilities = call("GET", f"/bundleIds/{bundle_id}/bundleIdCapabilities").get("data", [])
          if any(cap.get("attributes", {}).get("capabilityType") == "APPLE_ID_AUTH"
                 for cap in capabilities):
              print("Sign in with Apple capability already enabled on the bundle ID")
          else:
              call("POST", "/bundleIdCapabilities", payload={"data": {
                  "type": "bundleIdCapabilities",
                  "attributes": {
                      "capabilityType": "APPLE_ID_AUTH",
                      "settings": [{
                          "key": "APPLE_ID_AUTH_APP_CONSENT",
                          "options": [{"key": "PRIMARY_APP_CONSENT", "enabled": True}],
                      }],
                  },
                  "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bundle_id}}}}})
              print("Enabled Sign in with Apple capability on the bundle ID")


          profiles = call("GET", "/profiles?filter[name]=Open%20Mahjong%20App%20Store%20CI&limit=50").get("data", [])
          for profile in profiles:
              call("DELETE", f"/profiles/{profile['id']}")
              print(f"Deleted previous CI profile {profile['id']}")
          profile = call("POST", "/profiles", payload={"data": {"type": "profiles", "attributes": {
              "name": "Open Mahjong App Store CI", "profileType": "IOS_APP_STORE"}, "relationships": {
              "bundleId": {"data": {"type": "bundleIds", "id": bundle_id}},
              "certificates": {"data": [{"type": "certificates", "id": shared_cert_id}]}}}})["data"]
          (sign_dir / "OpenMahjong.mobileprovision").write_bytes(base64.b64decode(profile["attributes"]["profileContent"]))
          print(f"Created provisioning profile {profile['id']}")

          # Bundle cert + key into a .p12 for the keychain install step.
          subprocess.run(["openssl", "x509", "-inform", "DER", "-in", str(sign_dir / "ci.cer"),
                          "-out", str(sign_dir / "ci.pem")], check=True)
          p12_password = base64.b64encode(os.urandom(24)).decode()
          subprocess.run(["openssl", "pkcs12", "-export", "-inkey", str(sign_dir / "ci.key"),
                          "-in", str(sign_dir / "ci.pem"), "-out", str(sign_dir / "distribution.p12"),
                          "-passout", f"pass:{p12_password}", "-name", "Open Mahjong CI"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"OM_P12_PATH={sign_dir / 'distribution.p12'}\n")
              env_file.write(f"OM_P12_PASSWORD={p12_password}\n")
              env_file.write(f"OM_PROFILE_PATH={sign_dir / 'OpenMahjong.mobileprovision'}\n")
          PYASC

      - name: Install signing certificate and provisioning profile
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/openmahjong-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cp "$OM_P12_PATH" "$RUNNER_TEMP/distribution.p12"
          cp "$OM_PROFILE_PATH" "$RUNNER_TEMP/OpenMahjong.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/distribution.p12" -P "$OM_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/OpenMahjong.mobileprovision" > "$RUNNER_TEMP/OpenMahjong-profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/OpenMahjong-profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/OpenMahjong-profile.plist")
          app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/OpenMahjong-profile.plist")
          if [[ "$app_identifier" != "R42LWFBXBH.app.openmahjong" ]]; then
            echo "::error::The provisioning profile must match team R42LWFBXBH and bundle ID app.openmahjong. Got application-identifier: $app_identifier"
            exit 1
          fi
          cp "$RUNNER_TEMP/OpenMahjong.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "OM_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "OM_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          cp "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project packages/web/ios/App/App.xcodeproj -scheme App

      # Signing settings are scoped to the App target in the project
      # file (Release configuration: Manual style, team R42LWFBXBH,
      # Apple Distribution identity, and the "Open Mahjong App Store
      # CI" profile specifier — committed project state verified by
      # scripts/configure-mobile-ios.mjs). They must NOT be passed as
      # command-line overrides here: xcodebuild applies those to EVERY
      # target, and the SPM package targets (Capacitor plugins)
      # reject a manually specified provisioning profile outright —
      # that is what failed Munch run 43114783632's archive. This is
      # the same shape as PitTech's proven archive step.
      - name: Archive for App Store Connect
        run: >-
          xcodebuild archive
          -project packages/web/ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/OpenMahjong.xcarchive
          -derivedDataPath build/ios-release
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CODE_SIGNING_KEYCHAIN="$OM_KEYCHAIN_PATH"
          CODE_SIGNING_ALLOWED=YES

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>upload</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>R42LWFBXBH</string>
            <key>provisioningProfiles</key><dict>
              <key>app.openmahjong</key><string>$OM_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:app.openmahjong $OM_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath build/OpenMahjong.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload signed archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmahjong-ios-app-store-${{ github.run_number }}
          path: build/OpenMahjong.xcarchive
          if-no-files-found: error
          retention-days: 30
