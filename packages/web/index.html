<h1>Open Mahjong</h1>
<p>Free forever. Open source mahjong.</p>
<p>Open Mahjong is a web app for playing riichi mahjong against the CPU. Games are East-only or East + South, with real scoring. No account is needed to play.</p>
<p>The app includes 11 interactive tutorial lessons played on the real table, and a guided mode that offers hints with explanations during CPU games.</p>
<p>Signing in with Google is optional. Signed-in players can save their game history and settings to their account.</p>
<p>Open Mahjong is free and open source under the AGPLv3 license. The source code is on <a href="https://github.com/michaelhmiv/OpenMahjong">GitHub</a>. See the <a href="/privacy">privacy policy</a>.</p>
